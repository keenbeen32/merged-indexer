# yaml-language-server: $schema=./node_modules/envio/evm.schema.json
name: pumex-merged-envio
description: >-
  Merged Envio indexer covering five previously-separate Pumex indexers:
  algebra-farming, cl-analytics, helper, v1 and v4. The algebra indexer
  (pumex-algebra-envio) is deliberately NOT merged and stays standalone.

  Entity types are prefixed per source indexer — Farm_, Analytics_, Helper_,
  V1_, V4_ — so all five schemas coexist in one database and one GraphQL
  endpoint. See schema.graphql for the same sectioning.

# Every address-keyed entity ID is built from lowercase hex; `checksum` (the
# Envio default) would change all of them.
address_format: lowercase

# `gas` is declared PER-EVENT below, never here: Envio rejects it for any chain
# that syncs over RPC, and chain 1439 does.
field_selection:
  transaction_fields:
    - hash
    - from
    - gasPrice
    - transactionIndex

contracts:
  - name: NonfungiblePositionManager
    abi_file_path: ./abis/analytics/NonfungiblePositionManager.json
    handler: ./src/nfpm.ts
    events:
      - event: Collect(uint256 indexed tokenId, address recipient, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: DecreaseLiquidity(uint256 indexed tokenId, uint128 liquidity, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: IncreaseLiquidity(uint256 indexed tokenId, uint128 liquidityDesired, uint128 actualLiquidity, uint256 amount0, uint256 amount1, address pool)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]

  - name: EternalFarming
    abi_file_path: ./abis/farm/EternalFarming.json
    handler: ./src/farm/handlers/EternalFarming.ts
    events:
      - event: EternalFarmingCreated(address indexed rewardToken, address indexed bonusRewardToken, address indexed pool, address virtualPool, uint256 nonce, uint256 reward, uint256 bonusReward, uint24 minimalAllowedPositionWidth)
      - event: FarmEntered(uint256 indexed tokenId, bytes32 indexed incentiveId, uint128 liquidity)
      - event: FarmEnded(uint256 indexed tokenId, bytes32 indexed incentiveId, address indexed rewardAddress, address bonusRewardToken, address owner, uint256 reward, uint256 bonusReward)
      - event: RewardClaimed(address indexed to, uint256 reward, address indexed rewardAddress, address indexed owner)
      - event: IncentiveDeactivated(bytes32 indexed incentiveId)
      - event: RewardsRatesChanged(uint128 rewardRate, uint128 bonusRewardRate, bytes32 incentiveId)
      - event: RewardsAdded(uint256 rewardAmount, uint256 bonusRewardAmount, bytes32 incentiveId)
      - event: RewardAmountsDecreased(uint256 rewardAmount, uint256 bonusRewardAmount, bytes32 incentiveId)
      - event: RewardsCollected(uint256 tokenId, bytes32 incentiveId, uint256 rewardAmount, uint256 bonusRewardAmount)

  - name: Analytics_Factory
    abi_file_path: ./abis/analytics/factory.json
    handler: ./src/analytics/handlers/Factory.ts
    events:
      - event: Pool(address indexed token0, address indexed token1, address pool)
        name: PoolCreated # `Pool` would collide with the Analytics_Pool contract name
      - event: CustomPool(address indexed deployer, address indexed token0, address indexed token1, address pool)
      - event: DefaultCommunityFee(uint16 newDefaultCommunityFee)

  - name: Analytics_Pool
    abi_file_path: ./abis/analytics/pool.json
    handler: ./src/analytics/handlers/Pool.ts
    events:
      - event: Initialize(uint160 price, int24 tick)
      - event: Swap(address indexed sender, address indexed recipient, int256 amount0, int256 amount1, uint160 price, uint128 liquidity, int24 tick)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: SwapFee(address indexed sender, uint24 overrideFee, uint24 pluginFee)
      - event: Mint(address sender, address indexed owner, int24 indexed bottomTick, int24 indexed topTick, uint128 liquidityAmount, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: Burn(address indexed owner, int24 indexed bottomTick, int24 indexed topTick, uint128 liquidityAmount, uint256 amount0, uint256 amount1)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: BurnFee(address indexed owner, uint24 pluginFee)
      - event: Fee(uint16 fee)
      - event: Collect(address indexed owner, address recipient, int24 indexed bottomTick, int24 indexed topTick, uint128 amount0, uint128 amount1)
        field_selection:
          transaction_fields: [hash, from, gasPrice, transactionIndex, gas]
      - event: CommunityFee(uint16 communityFeeNew)
      - event: TickSpacing(int24 newTickSpacing)
      - event: Plugin(address newPluginAddress)
      - event: PluginConfig(uint8 newPluginConfig)

  - name: VoterV5
    abi_file_path: ./abis/helper/VoterV5.json
    handler: ./src/helper/handlers/VoterV5.ts
    events:
      - event: GaugeCreated(address indexed gauge, address creator, address internal_bribe, address indexed external_bribe, address indexed pool)

  - name: Options
    abi_file_path: ./abis/helper/oToken.json
    handler: ./src/helper/handlers/Options.ts
    events:
      - event: Exercise(address indexed sender, address indexed recipient, uint256 amount, uint256 paymentAmount)
      - event: ExerciseVe(address indexed sender, address indexed recipient, uint256 amount, uint256 paymentAmount, uint256 nftId)

  - name: GaugeV2
    abi_file_path: ./abis/helper/GaugeV2.json
    handler: ./src/helper/handlers/GaugeV2.ts
    events:
      - event: Deposit(address indexed user, uint256 amount)
      - event: Withdraw(address indexed user, uint256 amount)
      - event: Harvest(address indexed user, uint256 reward)

  - name: PreMining
    abi_file_path: ./abis/helper/PreMining.json
    handler: ./src/helper/handlers/PreMining.ts
    events:
      - event: LogPoolAddition(uint256 indexed pid, uint256 allocPoint, address indexed stakeToken, uint16 depositFee)
      - event: Deposit(address indexed user, uint256 indexed pid, uint256 amount)
      - event: Withdraw(address indexed user, uint256 indexed pid, uint256 amount)
      - event: EmergencyWithdraw(address indexed user, uint256 indexed pid, uint256 amount)

  - name: VeToken
    abi_file_path: ./abis/helper/veToken.json
    handler: ./src/helper/handlers/VeToken.ts
    events:
      - event: LockCreated(uint256 indexed tokenId, address indexed to, uint256 value, uint256 unlockTime, bool isPermanent)
      - event: LockAmountIncreased(uint256 indexed tokenId, uint256 value)
      - event: LockDurationExtended(uint256 indexed tokenId, uint256 newUnlockTime, bool isPermanent)
      - event: LockUpdated(uint256 indexed tokenId, uint256 value, uint256 unlockTime, bool isPermanent)
      - event: LockMerged(uint256 indexed fromTokenId, uint256 indexed toTokenId, uint256 totalValue, uint256 unlockTime, bool isPermanent)
      - event: LockSplit(uint256[] splitWeights, uint256 indexed _tokenId)
      - event: Transfer(address indexed from, address indexed to, uint256 indexed tokenId)
      - event: SupplyUpdated(uint256 oldSupply, uint256 newSupply)
      - event: PayoutClaimed(uint256 indexed tokenId, address indexed recipient, uint256 claimAmount)
      - event: UnlockPermanent(uint256 indexed tokenId, address indexed sender, uint256 unlockTime)

  - name: V1_Factory
    abi_file_path: ./abis/v1/Factory.json
    handler: ./src/v1/factory.ts
    events:
      - event: PairCreated(address indexed token0, address indexed token1, bool stable, address pair, uint256 param4)

  - name: V1_Pair
    abi_file_path: ./abis/v1/Pair.json
    handler: ./src/v1/core.ts
    events:
      - event: Mint(address indexed sender, uint256 amount0, uint256 amount1)
      - event: Burn(address indexed sender, uint256 amount0, uint256 amount1, address indexed to)
      - event: Swap(address indexed sender, uint256 amount0In, uint256 amount1In, uint256 amount0Out, uint256 amount1Out, address indexed to)
      - event: Sync(uint256 reserve0, uint256 reserve1)
      - event: Transfer(address indexed from, address indexed to, uint256 value)

  - name: PoolManager
    abi_file_path: ./abis/v4/PoolManager.json
    handler: ./src/v4/handlers/PoolManager.ts
    events:
      - event: Initialize(bytes32 indexed id, address indexed currency0, address indexed currency1, address hooks, uint24 fee, bytes32 parameters, uint160 sqrtPriceX96, int24 tick)
      - event: ModifyLiquidity(bytes32 indexed id, address indexed sender, int24 tickLower, int24 tickUpper, int256 liquidityDelta, bytes32 salt)
      - event: Swap(bytes32 indexed id, address indexed sender, int128 amount0, int128 amount1, uint160 sqrtPriceX96, uint128 liquidity, int24 tick, uint24 fee, uint16 protocolFee)
      - event: DynamicLPFeeUpdated(bytes32 indexed id, uint24 dynamicLPFee)
      - event: ProtocolFeeUpdated(bytes32 indexed id, uint24 protocolFee)

  - name: PositionManager
    abi_file_path: ./abis/v4/PositionManager.json
    handler: ./src/v4/handlers/PositionManager.ts
    events:
      - event: ModifyLiquidity(uint256 indexed tokenId, int256 liquidityChange, int256 feesAccrued)
      - event: Subscription(uint256 indexed tokenId, address indexed subscriber)
      - event: Unsubscription(uint256 indexed tokenId, address indexed subscriber)
      - event: Transfer(address indexed from, address indexed to, uint256 indexed id)

