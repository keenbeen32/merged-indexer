  userShare: BigDecimal! @config(precision: 100, scale: 60) # snapshot of users share of the pool
  userToken0: BigInt! @config(precision: 78) # snapshot of users token0 balance
  userToken1: BigInt! @config(precision: 78) # snapshot of users token1 balance
  userToken0Decimals: BigDecimal! @config(precision: 100, scale: 60)
  userToken1Decimals: BigDecimal! @config(precision: 100, scale: 60)
  reserve0: BigInt! @config(precision: 78) # snapshot of pair token0 reserves
  reserve1: BigInt! @config(precision: 78) # snapshot of pair token1 reserves
